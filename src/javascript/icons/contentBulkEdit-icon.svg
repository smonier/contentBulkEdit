<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A6E"/>
      <stop offset="100%" stop-color="#0D2247"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2A623"/>
      <stop offset="100%" stop-color="#D47F12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#shine)"/>
  <rect x="0" y="0" width="256" height="256" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Row 1 -->
  <rect x="32" y="46" width="192" height="34" rx="6" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="42" y="55" width="16" height="16" rx="3" fill="#3B8BD4" stroke="#5AB0F0" stroke-width="1"/>
  <path d="M46 63 L50 68 L58 58" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="59" width="88" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="68" y="68" width="56" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Row 2 -->
  <rect x="32" y="88" width="192" height="34" rx="6" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="42" y="97" width="16" height="16" rx="3" fill="#3B8BD4" stroke="#5AB0F0" stroke-width="1"/>
  <path d="M46 105 L50 110 L58 100" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="101" width="104" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="68" y="110" width="68" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Row 3 -->
  <rect x="32" y="130" width="192" height="34" rx="6" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="42" y="139" width="16" height="16" rx="3" fill="#3B8BD4" stroke="#5AB0F0" stroke-width="1"/>
  <path d="M46 147 L50 152 L58 142" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="143" width="72" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="68" y="152" width="92" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Bulk selection bracket + arrow -->
  <path d="M29 50 L24 50 L24 162 L29 162" fill="none" stroke="#EF9F27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="106" x2="16" y2="106" stroke="#EF9F27" stroke-width="2" stroke-linecap="round"/>
  <polygon points="8,106 16,102 16,110" fill="#EF9F27"/>

  <!-- Pencil badge circle -->
  <circle cx="186" cy="186" r="44" fill="#0D2247"/>
  <circle cx="186" cy="186" r="44" fill="none" stroke="#EF9F27" stroke-width="2.5"/>

  <!-- Pencil icon (rotated -40deg around badge center) -->
  <g transform="translate(186, 186) rotate(-40)">
    <rect x="-7" y="-26" width="14" height="34" rx="2" fill="url(#pencilGrad)"/>
    <rect x="-7" y="8" width="14" height="7" rx="1" fill="#C0C0C0"/>
    <rect x="-6" y="15" width="12" height="7" rx="2" fill="#F4A0A0"/>
    <polygon points="0,28 -7,8 7,8" fill="#F2D59A"/>
    <polygon points="0,32 -4,20 4,20" fill="#444"/>
    <rect x="-3" y="-24" width="3" height="28" rx="1.5" fill="#ffffff" fill-opacity="0.25"/>
  </g>
</svg>
